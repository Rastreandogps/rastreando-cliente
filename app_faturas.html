<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Baixe o app de Faturas — Rastreando GPS</title>
<meta name="theme-color" content="#0F1E3A">
<style>
:root{--navy:#1B3A6B;--fundo:#0F1E3A;--green:#00B37E;--txt:#fff;--txt2:rgba(255,255,255,.72);--card:rgba(255,255,255,.07);--borda:rgba(255,255,255,.14)}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--fundo)}
body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;color:var(--txt);background:radial-gradient(120% 60% at 50% 0%,#1B3A6B 0%,var(--fundo) 60%);min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  padding:calc(20px + env(safe-area-inset-top,0px)) 16px calc(28px + env(safe-area-inset-bottom,0px));-webkit-font-smoothing:antialiased}
main{width:100%;max-width:520px;text-align:center}
.icone{width:120px;height:120px;display:block;margin:0 auto 18px;filter:drop-shadow(0 12px 28px rgba(0,0,0,.4))}
h1{font-weight:800;font-size:1.5rem;line-height:1.25;margin-bottom:8px}
.lead{color:var(--txt2);font-size:.95rem;line-height:1.45;margin-bottom:20px}
.botoes{display:flex;flex-direction:column;gap:10px}
.btn{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:14px;background:var(--card);border:1px solid var(--borda);color:var(--txt);
  text-decoration:none;text-align:left;transition:background .15s}
.btn:hover,.btn:active{background:rgba(255,255,255,.13)}
.btn:focus-visible{outline:3px solid rgba(0,179,126,.6);outline-offset:2px}
.ico{width:40px;height:40px;border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ico svg{width:22px;height:22px}
.btn b{display:block;font-size:.98rem}
.btn span{font-size:.78rem;color:var(--txt2)}
.btn.destaque{background:var(--green);border-color:var(--green)}
.btn.destaque span{color:rgba(255,255,255,.85)}
.rodape{margin-top:22px;font-size:.78rem;color:var(--txt2);line-height:1.5}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
