<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rastreando GPS — Regularize sua mensalidade</title>
<meta name="description" content="Veja o que está em aberto e pague tudo num PIX só.">
<meta name="theme-color" content="#1B3A6B">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- 19/11/2026 (pedido do dono): REGULARIZAR EM CONVERSA, no mesmo jeito do agendar.html. Frases curtas.
     Usa as MESMAS regras do regularizar.html (servidor): vencida entra sempre; a que vence em até 5 dias o cliente escolhe;
     2+ = um PIX só. Depois que o PIX cai, mostra o login do app (sem senha). Acesso desativado (encerrado) = não mostra. -->
<style>
:root{--navy:#1B3A6B;--navy2:#2451A0;--green:#00B37E;--bg:#EEF2F7;--me:#DCF4EA;--bot:#FFFFFF;--text:#1A2035;--text2:#4A5568;--text3:#8A96AA;--border:#E2E8F0;--danger:#E03131;--amber:#E07B00}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;height:100dvh}
header{background:var(--navy);color:#fff;display:flex;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;box-shadow:0 2px 8px rgba(0,0,0,.15);z-index:2}
header img{width:42px;height:42px;border-radius:50%;flex:none;border:2px solid rgba(255,255,255,.25)}
header .t{font-family:Sora,Inter,sans-serif;font-weight:700;font-size:16px;line-height:1.2}
header .s{font-size:12.5px;opacity:.8;display:flex;align-items:center;gap:6px}
header .s i{width:8px;height:8px;border-radius:50%;background:#3ddc97;display:inline-block}
main{flex:1;overflow-y:auto;padding:16px 12px 8px;scroll-behavior:smooth}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.msg{max-width:84%;padding:10px 13px;border-radius:16px;font-size:15.5px;line-height:1.42;white-space:pre-line;word-wrap:break-word;animation:in .22s ease-out}
.bot{background:var(--bot);align-self:flex-start;border-top-left-radius:4px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.me{background:var(--me);align-self:flex-end;border-top-right-radius:4px}
.msg b{font-weight:700}
.erro{background:#FFF1F1;color:#B42323;align-self:flex-start;border-top-left-radius:4px}
.digitando{display:inline-flex;gap:4px;padding:14px 16px}.digitando span{width:7px;height:7px;border-radius:50%;background:#B8C2D3;animation:pula 1s infinite}.digitando span:nth-child(2){animation-delay:.15s}.digitando span:nth-child(3){animation-delay:.3s}
@keyframes pula{0%,60%,100%{transform:translateY(0);opacity:.6}30%{transform:translateY(-4px);opacity:1}}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.botoes{display:flex;flex-wrap:wrap;gap:10px;align-self:stretch;justify-content:center;margin-top:4px;animation:in .22s ease-out}
.botoes button,.botoes a{flex:1 1 40%;border:1.5px solid var(--navy2);background:#fff;color:var(--navy2);font:600 16px Inter,sans-serif;padding:14px 16px;border-radius:14px;cursor:pointer;text-align:center;text-decoration:none;box-shadow:0 2px 8px rgba(27,58,107,.10)}
.botoes .pri{background:var(--green);border-color:var(--green);color:#fff;box-shadow:0 4px 14px rgba(0,179,126,.40)}
.botoes .wa{background:#25D366;border-color:#25D366;color:#fff}
.botoes .leve{flex:1 1 100%;border:0;background:none;box-shadow:none;color:var(--text3);font-weight:500;font-size:14px;padding:6px}
.botoes button:active,.botoes a:active{transform:scale(.97)}
.botoes button:disabled{opacity:.55}
.cartao{background:#fff;border:1px solid var(--border);border-radius:16px;padding:14px 14px 12px;align-self:stretch;font-size:15px;line-height:1.45;animation:in .22s ease-out;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.cartao h4{margin:0 0 8px;font:700 15px Sora,Inter,sans-serif;color:var(--navy)}
.fat{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid #F0F3F7}
.fat:first-of-type{border-top:0;padding-top:2px}
.fat .d{font-weight:600}.fat .q{font-size:12.5px;color:var(--text3);margin-top:1px}
.fat .v{font-weight:700;white-space:nowrap}
.fat .tg{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;margin-left:6px;vertical-align:1px}
.tg.venc{background:rgba(224,49,49,.1);color:var(--danger)}.tg.prox{background:rgba(224,123,0,.12);color:#A35A00}
.total{display:flex;justify-content:space-between;align-items:baseline;border-top:1.5px solid var(--border);margin-top:6px;padding-top:10px;font:800 20px Sora,Inter,sans-serif}
.total small{font:500 12px Inter,sans-serif;color:var(--text3);display:block;margin-top:2px}
.pix{text-align:center}
.pix .valor{font:800 26px Sora,Inter,sans-serif;color:var(--text);margin:2px 0 10px}
.pix img{width:220px;max-width:100%;height:auto;border:1px solid var(--border);border-radius:12px;padding:6px;background:#fff}
.pix .cc{margin-top:10px;font-size:12px;color:var(--text3);word-break:break-all;background:#F6F8FB;border-radius:10px;padding:8px 10px;max-height:58px;overflow:hidden;text-align:left}
.copiar{width:100%;margin-top:10px;border:0;border-radius:14px;background:var(--navy2);color:#fff;font:700 16px Inter,sans-serif;padding:15px;cursor:pointer;box-shadow:0 4px 14px rgba(36,81,160,.35)}
.copiar.ok{background:var(--green)}
.espera{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:10px;font-size:13px;color:var(--text3)}
.espera i{width:8px;height:8px;border-radius:50%;background:var(--amber);animation:pisca 1.2s infinite}
@keyframes pisca{50%{opacity:.25}}
.acesso .l{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-top:1px solid #F0F3F7}
.acesso .l:first-of-type{border-top:0}
.acesso .k{color:var(--text3);font-size:13px}.acesso .val{font:700 16px Inter,sans-serif;word-break:break-all}
.acesso .mini{border:1.5px solid var(--navy2);background:#fff;color:var(--navy2);font:600 13px Inter,sans-serif;padding:6px 12px;border-radius:999px;cursor:pointer;flex:none}
.fim{text-align:center;font-size:44px;line-height:1;margin:4px 0}
.fat.sel{cursor:pointer;gap:12px}.fat.sel.trava{cursor:default}
.fat .ck{flex:none;width:24px;height:24px;border-radius:7px;border:2px solid #b8c0cc;background:#fff;display:flex;align-items:center;justify-content:center;transition:background .15s,border-color .15s}
.fat .ck svg{width:14px;height:14px;fill:none;stroke:#fff;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.fat.on .ck{background:var(--green);border-color:var(--green)}.fat.on .ck svg{opacity:1}
.fat:not(.on) .d,.fat:not(.on) .v{opacity:.5}
.fat .fx{flex:1;min-width:0}
.gerar{width:100%;margin-top:14px;border:0;border-radius:14px;background:var(--green);color:#fff;font:800 18px Sora,Inter,sans-serif;padding:16px;cursor:pointer;box-shadow:0 4px 14px rgba(0,179,126,.40)}
.gerar:disabled{opacity:.7}
/* 19/11/2026 (dono): "aguarde, estou buscando" com barrinha andando (evita a ansiedade) */
.carregando{display:flex;flex-direction:column;gap:8px;min-width:220px}
.carregando .bar{height:6px;border-radius:6px;background:#E8EDF4;overflow:hidden;position:relative}
.carregando .bar i{position:absolute;top:0;bottom:0;width:40%;border-radius:6px;background:linear-gradient(90deg,var(--green),#22d996);animation:corre 1.1s ease-in-out infinite}
@keyframes corre{0%{left:-40%}100%{left:100%}}
footer{background:#fff;border-top:1px solid var(--border);padding:8px 10px calc(8px + env(safe-area-inset-bottom))}
footer form{max-width:640px;margin:0 auto;display:flex;gap:8px;align-items:center}
footer input{flex:1;min-width:0;border:1.5px solid var(--border);border-radius:999px;padding:12px 16px;font:16px Inter,sans-serif;color:var(--text);background:#F8FAFC;outline:none}
footer input:focus{border-color:var(--navy2);background:#fff}
footer button{flex:none;width:46px;height:46px;border-radius:50%;border:0;background:var(--navy2);color:#fff;font-size:19px;cursor:pointer;display:grid;place-items:center}
footer button:disabled{background:#C3CCDA}
footer.some{display:none}
@media (prefers-reduced-motion:reduce){*{animation:none !important}}
</style>
</head>

  <div><div class="t">Rastreando GPS</div><div class="s"><i></i>Regularize sua mensalidade</div></div>
</header>
<main id="chat"><div class="wrap" id="wrap"></div></main>
<footer id="rodape" class="some"><form id="fEntrada" autocomplete="off"><input id="entrada" type="tel" inputmode="numeric" placeholder="Digite seu CPF" maxlength="18"><button id="enviar" aria-label="Enviar">➤</button></form></footer>

<script>
(function () {
  'use strict';
  var URL_FN = 'https://southamerica-east1-rastreando-assinaturas.cloudfunctions.net/cancelamento';
  var WA = 'https://wa.me/5521980886087?text=';
  var S = { sessao: null, r: null, sel: null, nome: '', poll: null, pago: false };
  var $ = function (id) { return document.getElementById(id); };
  var wrap = $('wrap'), chat = $('chat');

  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function brl(v) { return Number(v || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }); }
  function dataBR(iso) { var p = String(iso || '').split('-'); return p.length === 3 ? p[2] + '/' + p[1] : String(iso || ''); }
  function soDig(s) { return String(s || '').replace(/\D/g, ''); }
  function espera(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function rolar() { setTimeout(function () { chat.scrollTop = chat.scrollHeight; }, 30); }
  function add(el) { wrap.appendChild(el); rolar(); return el; }
  function div(cls, html) { var d = document.createElement('div'); d.className = cls; if (html != null) d.innerHTML = html; return d; }

  /* bolha do robô com "digitando…" antes (frases curtas: espera curta) */
  async function bot(html, cls) {
    var t = add(div('msg bot digitando', '<span></span><span></span><span></span>'));
    var txt = String(html).replace(/<[^>]+>/g, '');
    await espera(Math.min(1300, 450 + txt.length * 14));
    t.remove();
    return add(div('msg ' + (cls || 'bot'), html));
  }
  /* bolha "Aguarde..." com barrinha; devolve a bolha para tirar depois */
  async function carregar(txt) {
    var t = add(div('msg bot digitando', '<span></span><span></span><span></span>'));
    await espera(450); t.remove();
    return add(div('msg bot carregando', '<div>' + txt + '</div><div class="bar"><i></i></div>'));
  }
  function pronto(t) { var b = t.querySelector('.bar'); if (b) b.remove(); t.classList.remove('carregando'); }
  function eu(txt) { return add(div('msg me', esc(txt))); }
  function botoes(lista) {
    return new Promise(function (res) {
      var b = add(div('botoes'));
      lista.forEach(function (o) {
        var x = document.createElement('button'); x.type = 'button'; x.textContent = o.t; if (o.c) x.className = o.c;
        x.onclick = function () { b.remove(); if (!o.calado) eu(o.t); res(o.v); };
        b.appendChild(x);
      });
    });
  }
  function rodape(liga) { $('rodape').classList.toggle('some', !liga); if (liga) setTimeout(function () { $('entrada').focus(); }, 60); }

  async function chamar(acao, dados) {
    var r, j = {}, corpo = { acao: acao };
    for (var k in dados) corpo[k] = dados[k];
    try { r = await fetch(URL_FN, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ data: corpo }) }); }
    catch (e) { throw { message: 'Sem internet agora. Tente de novo.' }; }
    try { j = await r.json(); } catch (e) { j = {}; }
    if (!r.ok || j.error) {
      var st = j.error && j.error.status, msg = j.error && j.error.message;
      if (!msg || st === 'INTERNAL') msg = 'Não consegui agora. Tente de novo em instantes.';
      throw { message: msg, status: st };
    }
    return j.result;
  }

  function cpfValido(c) {
    if (!/^\d{11}$/.test(c) || /^(\d)\1+$/.test(c)) return false;
    function dv(n) { var s = 0; for (var i = 0; i < n; i++) s += Number(c[i]) * (n + 1 - i); var r = (s * 10) % 11; return r === 10 ? 0 : r; }
    return dv(9) === Number(c[9]) && dv(10) === Number(c[10]);
  }
  function cnpjValido(c) {
    if (!/^\d{14}$/.test(c) || /^(\d)\1+$/.test(c)) return false;
    function calc(n) { var p = n === 12 ? [5,4,3,2,9,8,7,6,5,4,3,2] : [6,5,4,3,2,9,8,7,6,5,4,3,2]; var s = 0; for (var i = 0; i < n; i++) s += Number(c[i]) * p[i]; var r = s % 11; return r < 2 ? 0 : 11 - r; }
    return calc(12) === Number(c[12]) && calc(13) === Number(c[13]);
  }
  function mascara(d) {
    if (d.length <= 11) return d.replace(/(\d{3})(\d)/, '$1.$2').replace(/(\d{3})(\d)/, '$1.$2').replace(/(\d{3})(\d{1,2})$/, '$1-$2');
    return d.replace(/^(\d{2})(\d)/, '$1.$2').replace(/^(\d{2})\.(\d{3})(\d)/, '$1.$2.$3').replace(/\.(\d{3})(\d)/, '.$1/$2').replace(/(\d{4})(\d)/, '$1-$2');
  }
  $('entrada').addEventListener('input', function () { this.value = mascara(soDig(this.value).slice(0, 14)); });

  /* ---------- 1. CPF ---------- */
  var esperandoCpf = null;
  $('fEntrada').addEventListener('submit', function (ev) { ev.preventDefault(); if (esperandoCpf) esperandoCpf($('entrada').value); });
  function pedirCpf() { return new Promise(function (res) { esperandoCpf = res; rodape(true); }); }

  async function etapaCpf(primeira) {
    if (primeira) { await bot('Oi! 👋 Aqui é da <b>Rastreando GPS</b>.'); await bot('Vamos deixar sua mensalidade em dia?\nQual é o seu <b>CPF</b>?'); }
    while (true) {
      var v = await pedirCpf(), d = soDig(v);
      var ok = d.length === 11 ? cpfValido(d) : d.length === 14 ? cnpjValido(d) : false;
      if (!ok) { await bot('Esse CPF não confere. Digita de novo?', 'erro'); continue; }
      esperandoCpf = null; rodape(false); $('entrada').value = ''; eu(mascara(d));
      var t = await carregar('Aguarde uns segundos, estou buscando seus dados… 🔎');
      try { var res = await chamar('divida_consultar', { cpf: d }); await espera(400); pronto(t); return res; }
      catch (e) {
        pronto(t);
        if (e.status === 'NOT_FOUND') await bot('Não achei cadastro com esse CPF. Confere os números?', 'erro');
        else if (e.status === 'RESOURCE_EXHAUSTED') { await bot('Muitas tentativas agora. Tente daqui a pouco.', 'erro'); return null; }
        else await bot(esc(e.message), 'erro');
      }
    }
  }

  /* ---------- 2. Faturas ----------
     19/11/2026 (dono): um quadro só, cada boleto com caixinha JÁ MARCADA e o total embaixo. Empurra para pagar tudo
     (sem pergunta "quer pagar junto?"). A vencida não sai (o servidor sempre inclui); a que vence logo pode ser desmarcada. */
  var CK = '<span class="ck"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>';
  function marcadas() { return S.r.faturas.filter(function (f) { return f.vencida || !S.sel || S.sel[f.k]; }); }
  function totalSel() { return marcadas().reduce(function (t, f) { return t + Number(f.atualizado || 0); }, 0); }
  function htmlQuadro() {
    var r = S.r, l = marcadas();
    return '<h4>Seus boletos</h4>' + r.faturas.map(function (f) {
      var on = l.indexOf(f) >= 0, trava = f.vencida || !S.sel;
      return '<div class="fat sel' + (on ? ' on' : '') + (trava ? ' trava' : '') + '" data-k="' + esc(f.k || '') + '">' + CK +
        '<div class="fx"><div class="d">' + dataBR(f.vencimento) + '</div>' + /* 19/11/2026 (dono): só a data, sem "venceu", "vence logo" nem dias */
        (f.vencida && Number(f.atualizado) > Number(f.valor) ? '<div class="q">' + brl(f.valor) + ' + multa e juros</div>' : '') + '</div>' +
        '<div class="v">' + brl(f.atualizado) + '</div></div>';
    }).join('') +
      '<div class="total"><div>Total' + (l.length > 1 ? '<small>' + l.length + ' boletos num PIX só</small>' : '') + '</div><div>' + brl(totalSel()) + '</div></div>' +
      '<button type="button" class="gerar" id="btnGerar">Gerar PIX</button>';
  }

  function etapaFaturas(res) {
    return new Promise(async function (fim) {
      S.sessao = res.sessao; S.r = res; S.nome = String((res.cliente && res.cliente.nome) || '').split(' ')[0];
      var r = res, venc = r.faturas.filter(function (f) { return f.vencida; }).length, prox = r.faturas.length - venc;
      S.sel = null;
      if (prox && r.faturas.every(function (f) { return f.k; })) { S.sel = {}; r.faturas.forEach(function (f) { S.sel[f.k] = true; }); }
      await bot(S.nome && S.nome.indexOf('*') < 0 ? 'Achei, <b>' + esc(S.nome) + '</b>. ✅' : 'Achei seu cadastro. ✅');
      await bot(prox ? 'Já juntei tudo para você ficar <b>em dia</b>. 👇' : (r.faturas.length > 1 ? 'Juntei tudo num PIX só. 👇' : 'Este é o seu boleto em aberto. 👇'));
      var c = add(div('cartao quadro', htmlQuadro()));
      function liga() {
        $('btnGerar').onclick = function () { c.querySelectorAll('.fat').forEach(function (x) { x.style.pointerEvents = 'none'; }); this.disabled = true; this.textContent = 'Gerando…'; fim(); };
      }
      c.addEventListener('click', function (ev) {
        var el = ev.target.closest('.fat.sel'); if (!el || el.classList.contains('trava') || !S.sel || $('btnGerar').disabled) return;
        var k = el.getAttribute('data-k'); S.sel[k] = !S.sel[k]; c.innerHTML = htmlQuadro(); liga();
      });
      liga(); rolar();
    });
  }

  /* ---------- 3. PIX ---------- */
  async function etapaPix() {
    var t = await carregar('Gerando seu PIX… ⏳');
    var dados = { sessao: S.sessao, acesso: true };
    if (S.sel) dados.sel = Object.keys(S.sel).filter(function (k) { return S.sel[k]; });
    var p;
    try { p = await chamar('divida_pix', dados); }
    catch (e) { pronto(t); await bot(esc(e.message), 'erro'); return fimErro(); }
    pronto(t);
    if (p.pago) return pagou(p.acesso);
    await bot('Pronto! Seu PIX 👇');
    var img = /^[A-Za-z0-9+/=]+$/.test(p.imagem || '') ? '<img alt="QR Code PIX" src="data:image/png;base64,' + p.imagem + '">' : '';
    var c = add(div('cartao pix', '<div class="valor">' + brl(p.valor) + '</div>' + img +
      '<div class="cc" id="cc">' + esc(p.copiaCola) + '</div><button type="button" class="copiar" id="copiar">Copiar código PIX</button>' +
      '<div class="espera" id="espera"><i></i>Esperando o pagamento…</div>'));
    $('copiar').onclick = function () { copiar(p.copiaCola, this); };
    await bot('Cole no app do seu banco. Assim que pagar, a tela confirma sozinha.');
    esperarPagamento();
  }
  function copiar(txt, btn) {
    var rot = btn.dataset.rot || (btn.dataset.rot = btn.textContent);
    var feito = function () { btn.textContent = 'Copiado ✓'; btn.classList.add('ok'); setTimeout(function () { btn.textContent = rot; btn.classList.remove('ok'); }, 2500); };
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(txt).then(feito, function () { velho(txt); feito(); });
    else { velho(txt); feito(); }
  }
  function velho(txt) { var ta = document.createElement('textarea'); ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch (e) {} ta.remove(); }

  function esperarPagamento() {
    var n = 0;
    clearInterval(S.poll);
    S.poll = setInterval(async function () {
      if (S.pago || document.hidden) return;
      if (++n > 50) { clearInterval(S.poll); var e = $('espera'); if (e) e.innerHTML = ''; mostrarJaPaguei(); return; }
      try { var d = await chamar('divida_status', { sessao: S.sessao, acesso: true }); if (d.pago) pagou(d.acesso); }
      catch (e) { if (e.status === 'RESOURCE_EXHAUSTED' || e.status === 'DEADLINE_EXCEEDED') { clearInterval(S.poll); mostrarJaPaguei(); } }
    }, 6000);
  }
  async function mostrarJaPaguei() {
    var b = await botoes([{ t: 'Já paguei', v: 1, c: 'pri' }]);
    var t = add(div('msg bot digitando', '<span></span><span></span><span></span>'));
    try { var d = await chamar('divida_status', { sessao: S.sessao, acesso: true }); t.remove(); if (d.pago) return pagou(d.acesso); }
    catch (e) { t.remove(); }
    await bot('Ainda não chegou. Pode levar 1 minutinho.');
    mostrarJaPaguei();
  }

  /* ---------- 4. Pago + acesso ---------- */
  async function pagou(acesso) {
    if (S.pago) return; S.pago = true; clearInterval(S.poll);
    var e = $('espera'); if (e) e.innerHTML = '<span style="color:#008F64;font-weight:700">✓ Pago</span>';
    add(div('fim', '✅'));
    await bot('<b>Pagamento confirmado!</b> Obrigado' + (S.nome ? ', ' + esc(S.nome) : '') + '.');
    if (acesso && acesso.login) {
      await bot('Seu acesso ao app 👇');
      var c = add(div('cartao acesso', '<h4>App Rastreando GPS</h4>' +
        '<div class="l"><div><div class="k">Login</div><div class="val" id="lg">' + esc(acesso.login) + '</div></div><button type="button" class="mini" id="cpLg">Copiar</button></div>' +
        '<div class="l"><div><div class="k">Senha</div><div style="font-size:14.5px">A mesma de sempre.<br>Nunca trocou? <b>123456</b></div></div></div>'));
      $('cpLg').onclick = function () { copiar(acesso.login, this); };
      var bx = add(div('botoes'));
      bx.innerHTML = '<a class="pri" href="' + esc(acesso.link || 'https://gps.rastreandogpsbr.com.br/instalar.html') + '" target="_blank" rel="noopener">Abrir o app</a>';
    } else if (acesso && acesso.encerrado) {
      await bot('Seu serviço de rastreamento está encerrado.');
      await bot('Para voltar, fale com a gente 👇');
      var b2 = add(div('botoes')); b2.innerHTML = '<a class="wa" href="' + WA + encodeURIComponent('Oi! Paguei pelo Regularizar e quero voltar com o rastreamento.') + '" target="_blank" rel="noopener">Falar no WhatsApp</a>';
    } else {
      await bot('Seu rastreamento segue funcionando normalmente.');
    }
  }

  async function fimErro() {
    var b = add(div('botoes')); b.innerHTML = '<a class="wa" href="' + WA + encodeURIComponent('Oi! Preciso de ajuda para regularizar minha mensalidade.') + '" target="_blank" rel="noopener">Falar no WhatsApp</a>';
  }

  async function semDivida(res) {
    var nome = String((res.cliente && res.cliente.nome) || '').split(' ')[0];
    if (!res.vencidas) { add(div('fim', '✅')); await bot('Tudo em dia' + (nome ? ', <b>' + esc(nome) + '</b>' : '') + '! Não tem nada em aberto.'); return; }
    await bot('Achei' + (nome ? ', <b>' + esc(nome) + '</b>' : '') + '. Sua mensalidade pode ser paga pelo boleto ou pelo app.');
    fimErro();
  }

  async function iniciar() {
    var res = await etapaCpf(true);
    if (!res) return fimErro();
    if (!res.elegivel) return semDivida(res);
    await etapaFaturas(res);
    await etapaPix();
  }
  iniciar();
})();
</script>
