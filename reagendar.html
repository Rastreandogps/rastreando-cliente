<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rastreando GPS — Remarcar Agendamento</title>
<meta name="theme-color" content="#1B3A6B">
<meta name="robots" content="noindex, nofollow">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root {
  --navy:      #1B3A6B;
  --navy-light:#2451A0;
  --green:     #00B37E;
  --green-dim: rgba(0,179,126,.12);
  --danger:    #E03131;
  --danger-dim:rgba(224,49,49,.08);
  --amber:     #E07B00;
  --amber-dim: rgba(224,123,0,.12);

  --bg:        #F5F7FA;
  --surface:   #FFFFFF;
  --border:    #E2E8F0;
  --border-focus: #2451A0;

  --text:      #1A2035;
  --text-2:    #4A5568;
  --text-3:    #8A96AA;

  --radius:    12px;
  --radius-sm: 8px;
  --shadow:    0 1px 3px rgba(0,0,0,.06), 0 4px 16px rgba(0,0,0,.06);

  --font-display: 'Sora', sans-serif;
  --font-body:    'Inter', sans-serif;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: var(--font-body);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding: 0 0 40px;
}
.header {
  background: linear-gradient(135deg, var(--navy), var(--navy-light));
  color: #fff;
  padding: 28px 20px 24px;
  text-align: center;
}
.header h1 {
  font-family: var(--font-display);
  font-size: 20px;
  margin: 0 0 4px;
}
.header p { margin: 0; font-size: 13px; opacity: .85; }
.wrap { max-width: 480px; margin: -16px auto 0; padding: 0 16px; }
.card {
  background: var(--surface);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 22px 20px;
  margin-bottom: 16px;
}
.card h2 {
  font-family: var(--font-display);
  font-size: 16px;
  margin: 0 0 12px;
}
.info-atual {
  background: var(--bg);
  border-radius: var(--radius-sm);
  padding: 14px 16px;
  font-size: 14px;
  color: var(--text-2);
  margin-bottom: 18px;
}
.info-atual b { color: var(--text); }
.info-atual .linha { margin-bottom: 4px; }
.info-atual .linha:last-child { margin-bottom: 0; }
.field { margin-bottom: 16px; }
.field label {
  display: block;
  font-size: 13px;
  font-weight: 600;
  margin-bottom: 6px;
  color: var(--text);
}
.field .dica {
  display: block;
  font-size: 12px;
  color: var(--text-3);
  margin-top: 5px;
}
.seg{display:flex;gap:8px}
.seg button{flex:1;padding:12px 10px;border:1.5px solid var(--border,#e2e8f0);border-radius:8px;background:#fff;font-family:inherit;font-size:.92rem;font-weight:600;color:#4A5568;cursor:pointer}
.seg button.ativo{border-color:#1B3A6B;background:#1B3A6B;color:#fff}
.seg.invalid{outline:2px solid #E03131;outline-offset:3px;border-radius:8px}
input[type="date"], input[type="text"], select {
  width: 100%;
  font-family: var(--font-body);
  font-size: 15px;
  color: var(--text);
  background: #fff;
  border: 1.5px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 12px 14px;
  appearance: none;
  -webkit-appearance: none;
}
select {
  background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%234A5568' stroke-width='2'%3e%3cpolyline points='6 9 12 15 18 9'/%3e%3c/svg%3e");
  background-repeat: no-repeat;
  background-position: right 12px center;
  background-size: 18px;
  padding-right: 38px;
}
input:focus, select:focus {
  outline: none;
  border-color: var(--border-focus);
}
select:disabled, input:disabled { opacity: .5; }
.status-msg {
  font-size: 13px;
  margin-top: 8px;
  min-height: 16px;
}
.status-msg.error   { color: var(--danger); }
.status-msg.success { color: var(--green); }
.status-msg.warn    { color: #E07B00; }
.modal-overlay-rg{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:999;opacity:0;pointer-events:none;transition:opacity .18s}
.modal-overlay-rg.open{opacity:1;pointer-events:auto}
.modal-box-rg{background:#fff;border-radius:14px;max-width:400px;width:100%;padding:22px;box-shadow:0 8px 32px rgba(0,0,0,.18)}
.modal-box-rg h3{font-size:1.05rem;color:var(--navy,#1B3A6B);margin-bottom:10px}
.modal-box-rg p{font-size:.88rem;color:#4A5568;line-height:1.55;margin-bottom:16px}
.modal-box-rg button{width:100%;padding:11px;border:none;border-radius:8px;background:var(--navy,#1B3A6B);color:#fff;font-weight:600;font-size:.9rem;cursor:pointer}
.btn {
  width: 100%;
  border: none;
  border-radius: var(--radius-sm);
  padding: 14px;
  font-family: var(--font-body);
  font-weight: 600;
  font-size: 15px;
  cursor: pointer;
  background: var(--navy);
  color: #fff;
}
.btn:disabled { opacity: .5; cursor: not-allowed; }
.msg-box {
  text-align: center;
  padding: 20px 8px;
}
.msg-box .icon { font-size: 40px; margin-bottom: 10px; }
.msg-box h2 { font-family: var(--font-display); font-size: 17px; margin: 0 0 8px; }
.msg-box p { color: var(--text-2); font-size: 14px; margin: 0 0 4px; line-height: 1.5; }
.whats-link {
  display: inline-block;
  margin-top: 14px;
  color: var(--green);
  font-weight: 600;
  text-decoration: none;
  font-size: 14px;
}
.spinner {
  width: 28px; height: 28px;
  border: 3px solid var(--border);
  border-top-color: var(--navy);
  border-radius: 50%;
  margin: 30px auto;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="header">
  <h1>📅 Remarcar Agendamento</h1>
  <p>Rastreando GPS</p>
</div>

<div class="modal-overlay-rg" id="modalDomingo">
  <div class="modal-box-rg">
    <h3>Atendimento aos domingos</h3>
    <p>Aos domingos o atendimento é <b>excepcional</b>. Vamos confirmar com você se temos disponibilidade nesse dia antes de fechar o horário.</p>
    <button type="button" id="modalDomingoFechar">Entendi</button>
  </div>
</div>

<div class="wrap">
  <div class="card" id="cardCarregando">
    <div class="spinner"></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

<script>
(function(){

  var CONFIG = {
    WEBAPP_URL: "https://script.google.com/macros/s/AKfycbytrExs-RnhJh7evbS4qM3L5nE3Vcmjd4moXRh8JGGonSG8ATADkMG-_DxLjslIYp943g/exec",
    WHATSAPP_NUMERO: "5521980886087"
  };

  var firebaseConfig = {
    apiKey: "AIzaSyCnWCqWOBgk5D4d3KmDM-XiIxEoMojRyd8",
    authDomain: "rastreando-gps.firebaseapp.com",
    projectId: "rastreando-gps",
    storageBucket: "rastreando-gps.firebasestorage.app",
    messagingSenderId: "481162335739",
    appId: "1:481162335739:web:fe3d91aaa33749a9f3e75e"
  };
  var dbFirestore = null;
  try {
    firebase.initializeApp(firebaseConfig);
    dbFirestore = firebase.firestore();
  } catch (e) {
    console.warn('[Rastreando GPS] Firebase não iniciou.', e);
  }

  var wrap = document.querySelector('.wrap');
  var modalDomingo = document.getElementById('modalDomingo');
  var modalDomingoFechar = document.getElementById('modalDomingoFechar');
  function abrirModalDomingo(){ if (modalDomingo) modalDomingo.classList.add('open'); }
  function fecharModalDomingo(){ if (modalDomingo) modalDomingo.classList.remove('open'); }
  if (modalDomingoFechar) modalDomingoFechar.addEventListener('click', fecharModalDomingo);
  if (modalDomingo) modalDomingo.addEventListener('click', function(ev){ if (ev.target === modalDomingo) fecharModalDomingo(); });

  function getOsId() {
    var params = new URLSearchParams(window.location.search);
    return params.get('os') || '';
  }

  function linkWhatsapp(texto) {
    return 'https://wa.me/' + CONFIG.WHATSAPP_NUMERO + '?text=' + encodeURIComponent(texto);
  }

  function renderMensagem(icone, titulo, texto, comLinkWhats) {
    var html =
      '<div class="card"><div class="msg-box">' +
      '<div class="icon">' + icone + '</div>' +
      '<h2>' + titulo + '</h2>' +
      '<p>' + texto + '</p>';
    if (comLinkWhats) {
      html += '<a class="whats-link" href="' + linkWhatsapp('Olá! Preciso remarcar meu agendamento.') + '" target="_blank">Falar no WhatsApp</a>';
    }
    html += '</div></div>';
    wrap.innerHTML = html;
  }

  // ── Utilitários de data (mesma lógica do formulário de agendamento) ──
  function diaSemana(iso){
    var p = String(iso||'').split('-');
    if (p.length !== 3) return null;
    var d = new Date(parseInt(p[0],10), parseInt(p[1],10)-1, parseInt(p[2],10));
    return d.getDay();
  }
  function addDiasISO(iso, n){
    var p = String(iso).split('-').map(Number);
    var d = new Date(Date.UTC(p[0], p[1]-1, p[2]));
    d.setUTCDate(d.getUTCDate() + n);
    return d.toISOString().slice(0,10);
  }
  var FERIADOS_FIXOS = ['01-01','01-20','04-21','04-23','05-01','09-07','10-12','11-02','11-15','11-20','12-25'];
  function pascoaISO(y){
    var a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4;
    var f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30;
    var i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451);
    var mes=Math.floor((h+l-7*m+114)/31), dia=((h+l-7*m+114)%31)+1;
    return y+'-'+String(mes).padStart(2,'0')+'-'+String(dia).padStart(2,'0');
  }
  function feriadosDoAno(y){
    var p = pascoaISO(y);
    var lista = FERIADOS_FIXOS.map(function(x){ return y+'-'+x; });
    lista.push(addDiasISO(p,-48), addDiasISO(p,-47), addDiasISO(p,-2), addDiasISO(p,60));
    return lista;
  }
  function ehFeriado(iso){
    var y = parseInt(String(iso).slice(0,4),10);
    return feriadosDoAno(y).indexOf(iso) >= 0;
  }
  function labelTarde(iso){
    return diaSemana(iso) === 6 ? 'Tarde (13h–14h)' : 'Tarde (13h–18h)';
  }
  function periodoTexto(p, iso){
    if (p === 'manha') return 'Manhã (8h–12h)';
    if (p === 'tarde') return labelTarde(iso);
    return '';
  }
  function isoParaDataBR(dataISO){
    var p = String(dataISO || '').split('-');
    if (p.length !== 3) return dataISO;
    return p[2] + '/' + p[1] + '/' + p[0];
  }
  function verificarDiaBloqueado(dataISO){
    if (!dbFirestore) return Promise.resolve(false);
    return dbFirestore.collection('configuracoes').doc('bloqueioAgendamento').get()
      .then(function(snap){
        if (!snap.exists) return false;
        var d = snap.data() || {};
        return !!d.ativo && d.data === isoParaDataBR(dataISO);
      })
      .catch(function(){ return false; });
  }

  // ── Busca os dados da OS ──
  // Caminho RÁPIDO: lê direto do Firestore (coleção pública "os_publicas",
  // sem dado sensível — só nome, veículo, tipo, endereço, data/hora e
  // quantas vezes já remarcou). Não depende do Apps Script "esquentar",
  // por isso abre bem mais rápido.
  function buscarOSRapido(osId) {
    if (!dbFirestore) return Promise.resolve(null);
    return dbFirestore.collection('os_publicas').doc(osId).get()
      .then(function(snap){
        if (!snap.exists) return null; // ainda não tem cópia pública — usa o plano B
        var d = snap.data() || {};
        return {
          ok: true,
          nome: d.nome || '',
          tipo: d.tipo || '',
          veiculo: d.veiculo || '',
          endereco: d.endereco || '',
          dataAtual: d.data || '',
          horaAtual: d.hora || '',
          remarcacoes: d.remarcacoes || 0
        };
      })
      .catch(function(){ return null; });
  }

  // Plano B (mais lento): pede pro Apps Script buscar na OS de verdade.
  // Só é usado se a cópia pública ainda não existir pra essa OS — e, nesse
  // caso, o próprio Apps Script já aproveita e cria essa cópia, então da
  // próxima vez esse mesmo link já vai pelo caminho rápido.
  function buscarOS(osId) {
    return fetch(CONFIG.WEBAPP_URL + '?action=buscarOS&id=' + encodeURIComponent(osId))
      .then(function(r){ return r.json(); });
  }

  // Deixa os dados prontos pra tela, do mesmo jeito não importa se vieram
  // do caminho rápido ou do plano B (nome só o primeiro nome, veículo só
  // o modelo do primeiro, etc).
  function primeiroNome(nome) {
    var n = String(nome || '').trim().split(/\s+/)[0] || 'Cliente';
    return n.charAt(0).toUpperCase() + n.slice(1).toLowerCase();
  }
  function primeiroVeiculoModelo(veiculo) {
    if (!veiculo) return '';
    var primeiro = String(veiculo).split(' || ')[0] || '';
    return primeiro.split(' | ')[0].trim();
  }
  function finalizarOS(os) {
    var remarcacoes = Number(os.remarcacoes || 0);
    return {
      nome: primeiroNome(os.nome),
      tipo: os.tipo || 'instalação',
      veiculo: primeiroVeiculoModelo(os.veiculo),
      endereco: os.endereco || '',
      dataAtual: os.dataAtual || '',
      horaAtual: os.horaAtual || '',
      remarcacoes: remarcacoes,
      limiteAtingido: remarcacoes >= 2
    };
  }

  // Confere DIRETO no Firebase se a remarcação realmente entrou.
  // Serve de rede de segurança: a gravação pode dar certo e mesmo assim a
  // resposta não chegar de volta no celular do cliente (aba trocada, sinal
  // oscilando, demora do servidor). Sem essa conferência, o cliente via
  // "erro de conexão" numa remarcação que na verdade funcionou — e tentava
  // de novo, gastando à toa uma das 2 remarcações que ele tem direito.
  // Tenta algumas vezes, com pausa, porque a gravação pode estar
  // terminando bem nesse instante.
  function conferirSeRemarcou(osId, dataISO, hora, tentativasRestantes) {
    if (!dbFirestore) return Promise.resolve(null);
    var dataBR = isoParaDataBR(dataISO);
    return dbFirestore.collection('os_publicas').doc(osId).get()
      .then(function(snap){
        var d = snap.exists ? (snap.data() || {}) : {};
        if (String(d.data || '') === dataBR && String(d.hora || '') === hora) {
          return { novaData: dataBR, novaHora: hora, novoEndereco: d.endereco || '' };
        }
        if (tentativasRestantes > 0) {
          return new Promise(function(resolve){
            setTimeout(function(){
              resolve(conferirSeRemarcou(osId, dataISO, hora, tentativasRestantes - 1));
            }, 2500);
          });
        }
        return null;
      })
      .catch(function(){ return null; });
  }

  function remarcar(osId, dataISO, hora, novoEndereco) {
    return fetch(CONFIG.WEBAPP_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'remarcar', id: osId, novaDataISO: dataISO, novaHora: hora, novoEndereco: novoEndereco || '' })
    }).then(function(r){ return r.json(); });
  }

  function escapeHtml(str) {
    return String(str || '').replace(/[&<>"']/g, function(c){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }

  // ── Monta a tela do formulário de remarcação ──
  function montarFormulario(osId, os) {
    var html =
      '<div class="card">' +
        '<h2>Escolha o novo horário</h2>' +
        '<div class="info-atual">' +
          '<div class="linha">👤 <b>' + escapeHtml(os.nome || 'Cliente') + '</b></div>' +
          (os.veiculo ? '<div class="linha">🚗 ' + escapeHtml(os.veiculo) + '</div>' : '') +
          '<div class="linha">🔧 ' + escapeHtml(os.tipo || 'instalação') + '</div>' +
          '<div class="linha">📅 Agendado para <b>' + (os.dataAtual || '-') + '</b> às <b>' + (os.horaAtual || '-') + '</b></div>' +
        '</div>' +
        '<div class="field">' +
          '<label for="novoEndereco">Endereço</label>' +
          '<input type="text" id="novoEndereco" value="' + escapeHtml(os.endereco || '') + '">' +
          '<span class="dica">Já vem preenchido com o endereço combinado. Só mude se precisar corrigir algo.</span>' +
        '</div>' +
        '<div class="field">' +
          '<label for="novaData">Nova data</label>' +
          '<input type="date" id="novaData">' +
        '</div>' +
        '<div class="field">' +
          '<label>Novo período</label>' +
          '<div class="seg" id="seg-periodo">' +
            '<button type="button" data-p="manha">Manhã (8h–12h)</button>' +
            '<button type="button" data-p="tarde">Tarde (13h–18h)</button>' +
          '</div>' +
        '</div>' +
        '<div class="status-msg" id="statusMsg"></div>' +
        '<button class="btn" id="btnConfirmar" disabled>Confirmar novo horário</button>' +
      '</div>';
    wrap.innerHTML = html;

    var enderecoInput = document.getElementById('novoEndereco');

    var dataInput = document.getElementById('novaData');
    var segPeriodo = document.getElementById('seg-periodo');
    var statusMsg = document.getElementById('statusMsg');
    var btnConfirmar = document.getElementById('btnConfirmar');
    var periodoEscolhido = '';

    var hoje = new Date();
    var isoHoje = hoje.getFullYear() + '-' + String(hoje.getMonth()+1).padStart(2,'0') + '-' + String(hoje.getDate()).padStart(2,'0');
    dataInput.setAttribute('min', isoHoje);

    function setStatus(msg, tipo) {
      statusMsg.textContent = msg;
      statusMsg.className = 'status-msg' + (tipo ? ' ' + tipo : '');
    }

    function limparPeriodo() {
      periodoEscolhido = '';
      segPeriodo.classList.remove('invalid');
      Array.prototype.forEach.call(segPeriodo.querySelectorAll('button'), function(b){ b.classList.remove('ativo'); });
      btnConfirmar.disabled = true;
    }

    Array.prototype.forEach.call(segPeriodo.querySelectorAll('button'), function(b){
      b.addEventListener('click', function(){
        periodoEscolhido = b.getAttribute('data-p');
        segPeriodo.classList.remove('invalid');
        Array.prototype.forEach.call(segPeriodo.querySelectorAll('button'), function(x){ x.classList.toggle('ativo', x === b); });
        btnConfirmar.disabled = false;
        setStatus('');
      });
    });

    var _ultimaDataAvisada = '';
    dataInput.addEventListener('change', function(){
      var dataISO = dataInput.value;
      setStatus('');
      limparPeriodo();
      if (!dataISO) return;

      if (ehFeriado(dataISO)) {
        setStatus('Não atendemos em feriados — escolha outro dia.', 'error');
        return;
      }

      var btnTarde = segPeriodo.querySelector('[data-p="tarde"]');
      btnTarde.textContent = labelTarde(dataISO);

      if (diaSemana(dataISO) === 0) {
        setStatus('Domingo é atendimento excepcional — vamos confirmar a disponibilidade com você.', 'warn');
        if (dataISO !== _ultimaDataAvisada) { _ultimaDataAvisada = dataISO; abrirModalDomingo(); }
      }

      verificarDiaBloqueado(dataISO).then(function(bloqueado){
        if (bloqueado) setStatus('Não estamos atendendo nessa data. Escolha outro dia.', 'error');
      });
    });

    btnConfirmar.addEventListener('click', function(){
      var dataISO = dataInput.value;
      var hora = periodoTexto(periodoEscolhido, dataISO);
      var novoEndereco = (enderecoInput.value || '').trim();
      if (!dataISO || !periodoEscolhido) return;
      btnConfirmar.disabled = true;
      btnConfirmar.textContent = 'Confirmando...';
      setStatus('');

      function mostrarSucesso(res) {
        renderMensagem('✅', 'Agendamento remarcado!',
          'Seu novo horário é <b>' + res.novaData + '</b> — <b>' + res.novaHora + '</b>' +
          (res.novoEndereco ? ', em <b>' + escapeHtml(res.novoEndereco) + '</b>' : '') +
          '. Te esperamos!');
      }
      function liberarBotao(msg) {
        setStatus(msg, 'error');
        btnConfirmar.disabled = false;
        btnConfirmar.textContent = 'Confirmar novo horário';
      }

      remarcar(osId, dataISO, hora, novoEndereco).then(function(res){
        if (res && res.ok) {
          mostrarSucesso(res);
        } else if (res && res.motivo) {
          // O servidor respondeu e disse por que não deu (ex: horário
          // ocupado, limite de remarcações) — é um "não" de verdade.
          liberarBotao(res.motivo);
        } else {
          liberarBotao('Não foi possível remarcar. Tente novamente.');
        }
      }).catch(function(){
        // A resposta não chegou — mas pode ter salvado assim mesmo.
        // Confere no Firebase antes de mostrar qualquer erro.
        btnConfirmar.textContent = 'Confirmando...';
        setStatus('Conferindo se o horário foi salvo...');
        conferirSeRemarcou(osId, dataISO, hora, 3).then(function(confirmado){
          if (confirmado) mostrarSucesso(confirmado);
          else liberarBotao('Não conseguimos confirmar agora. Tente de novo em instantes ou fale com a gente pelo WhatsApp.');
        });
      });
    });
  }

  // ── Início ──
  var osId = getOsId();
  if (!osId) {
    renderMensagem('⚠️', 'Link inválido', 'Não conseguimos identificar seu agendamento. Fale com a gente pelo WhatsApp.', true);
    return;
  }

  buscarOSRapido(osId).then(function(osRapido){
    if (osRapido) return osRapido;
    return buscarOS(osId); // cópia pública ainda não existe pra essa OS — usa o plano B
  }).then(function(os){
    if (!os || !os.ok) {
      renderMensagem('⚠️', 'Agendamento não encontrado', (os && os.motivo) || 'Não encontramos esse agendamento. Fale com a gente pelo WhatsApp.', true);
      return;
    }
    var osFinal = finalizarOS(os);
    if (osFinal.limiteAtingido) {
      renderMensagem('📞', 'Limite de remarcações atingido',
        'Esse agendamento já foi remarcado o máximo de vezes permitido por aqui. Fale com a gente pelo WhatsApp para ajustar o horário.', true);
      return;
    }
    montarFormulario(osId, osFinal);
  }).catch(function(){
    renderMensagem('⚠️', 'Erro ao carregar', 'Não conseguimos carregar seu agendamento agora. Tente de novo em instantes ou fale com a gente pelo WhatsApp.', true);
  });

})();
</script>
