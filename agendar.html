<!-- 13/11/2026 (pedido do dono): AGENDAMENTO EM CONVERSA. Pede os mesmos dados do agendamentocliente.html, uma pergunta
     por vez, e manda a OS para o mesmo lugar (planilha + painel do APP Técnico). Link com ?t=CÓDIGO vale UMA vez só
     (o robô do dono cria; o servidor trava quando termina). Sem preço: o cliente já combinou tudo antes. -->
<style>
:root{--navy:#1B3A6B;--navy2:#2451A0;--green:#00B37E;--bg:#EEF2F7;--me:#DCF4EA;--bot:#FFFFFF;--text:#1A2035;--text2:#4A5568;--text3:#8A96AA;--border:#E2E8F0;--danger:#E03131;--amber:#E07B00}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;height:100dvh}
header{background:var(--navy);color:#fff;display:flex;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;box-shadow:0 2px 8px rgba(0,0,0,.15);z-index:2}
header img{width:42px;height:42px;border-radius:50%;flex:none;border:2px solid rgba(255,255,255,.25)}
header .t{font-family:Sora,Inter,sans-serif;font-weight:700;font-size:16px;line-height:1.2}
header .s{font-size:12.5px;opacity:.8;display:flex;align-items:center;gap:6px}
header .s i{width:8px;height:8px;border-radius:50%;background:#3ddc97;display:inline-block}
#barra{height:3px;background:rgba(27,58,107,.12)}#barra div{height:100%;width:0;background:var(--green);transition:width .4s}
main{flex:1;overflow-y:auto;padding:16px 12px 8px;scroll-behavior:smooth}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.msg{max-width:84%;padding:10px 13px;border-radius:16px;font-size:15.5px;line-height:1.42;white-space:pre-line;word-wrap:break-word;animation:in .22s ease-out}
.bot{background:var(--bot);align-self:flex-start;border-top-left-radius:4px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.me{background:var(--me);align-self:flex-end;border-top-right-radius:4px}
.msg b{font-weight:600}
.dica{font-size:13px;color:var(--text3);margin-top:4px}
.erro{background:#FFF1F1;color:#B42323;align-self:flex-start;border-top-left-radius:4px}
.digitando{display:inline-flex;gap:4px;padding:14px 16px}.digitando span{width:7px;height:7px;border-radius:50%;background:#B8C2D3;animation:pula 1s infinite}.digitando span:nth-child(2){animation-delay:.15s}.digitando span:nth-child(3){animation-delay:.3s}
@keyframes pula{0%,60%,100%{transform:translateY(0);opacity:.6}30%{transform:translateY(-4px);opacity:1}}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.botoes{display:flex;flex-wrap:wrap;gap:8px;align-self:flex-end;justify-content:flex-end;max-width:94%;animation:in .22s ease-out}
.botoes button{border:1.5px solid var(--navy2);background:#fff;color:var(--navy2);font:600 14.5px Inter,sans-serif;padding:10px 15px;border-radius:999px;cursor:pointer}
.botoes button.pri{background:var(--green);border-color:var(--green);color:#fff;box-shadow:0 3px 10px rgba(0,179,126,.35)}
.botoes button.neg{background:#FFECEC;border-color:#F5A3A3;color:#C53030}
.botoes button:active{transform:scale(.97)}
.resumo{background:#fff;border:1px solid var(--border);border-radius:14px;padding:14px;align-self:stretch;font-size:14.5px;line-height:1.5;animation:in .22s ease-out}
.resumo h4{margin:0 0 8px;font:700 15px Sora,Inter,sans-serif;color:var(--navy)}
.resumo .l{display:flex;gap:8px;padding:5px 0;border-top:1px solid #F0F3F7}.resumo .l:first-of-type{border-top:0}
.resumo .k{color:var(--text3);min-width:92px;flex:none}
.fim{text-align:center;align-self:stretch;background:#fff;border-radius:16px;padding:22px 16px;box-shadow:0 1px 3px rgba(0,0,0,.06);animation:in .3s ease-out}
.fim .ok{font-size:44px}.fim h3{margin:6px 0 4px;font:700 19px Sora,Inter,sans-serif;color:var(--navy)}.fim p{margin:6px 0;color:var(--text2);font-size:14.5px}
.fim code{font-size:13px;background:#F1F4F8;padding:3px 8px;border-radius:6px}
.fim a{display:inline-block;margin-top:12px;background:#25D366;color:#fff;text-decoration:none;font-weight:600;padding:11px 18px;border-radius:999px}
.qd-fundo{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:in .2s}
.qd{background:#fff;width:100%;max-width:640px;max-height:88dvh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(16px + env(safe-area-inset-bottom));box-shadow:0 -6px 24px rgba(0,0,0,.18)}
.qd h3{margin:0 0 4px;font:700 17px Sora,Inter,sans-serif;color:var(--navy)}.qd .sub{font-size:13.5px;color:var(--text2);margin:0 0 12px}
.qd .lin{border:1px solid var(--border);border-radius:12px;padding:10px 12px;margin-bottom:10px}
.qd .lin b{display:block;font-size:13px;color:var(--text3);margin-bottom:6px;font-weight:600}
.qd .cps{display:flex;gap:8px;flex-wrap:wrap}.qd input[type=text]{flex:1;min-width:0;border:1.5px solid var(--border);border-radius:10px;padding:11px 12px;font:16px Inter,sans-serif;background:#F8FAFC;outline:none}
.qd input.placa{text-transform:uppercase;letter-spacing:.06em;font-weight:600}.qd input.ano{flex:0 0 92px}.qd input:focus{border-color:var(--navy2);background:#fff}.qd input.mal{border-color:var(--danger);background:#FFF5F5}
.qd label.ck{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--text2);margin-top:8px}.qd label.ck input{width:20px;height:20px}
.qd .erro{color:var(--danger);font-size:13px;min-height:18px;margin:2px 0 8px}
.qd .env{width:100%;border:0;border-radius:999px;background:var(--green);color:#fff;font:600 16px Inter,sans-serif;padding:14px;cursor:pointer}
.qd.treme{animation:treme .35s}@keyframes treme{0%,100%{transform:none}20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.qd .ach{font-size:13px;color:#16794F;margin-top:6px}
footer{background:#fff;border-top:1px solid var(--border);padding:8px 10px calc(8px + env(safe-area-inset-bottom))}
footer form{max-width:640px;margin:0 auto;display:flex;gap:8px;align-items:center}
footer input{flex:1;min-width:0;border:1.5px solid var(--border);border-radius:999px;padding:12px 16px;font:16px Inter,sans-serif;color:var(--text);background:#F8FAFC;outline:none}
footer input:focus{border-color:var(--navy2);background:#fff}
footer input[type=date]{padding:10px 14px}
footer button{flex:none;width:46px;height:46px;border-radius:50%;border:0;background:var(--navy2);color:#fff;font-size:19px;cursor:pointer;display:grid;place-items:center}
footer button:disabled{background:#C3CCDA}
footer.trava{display:none}
.travado{max-width:640px;margin:0 auto;text-align:center;color:var(--text3);font-size:13.5px;padding:6px}
</style>
</head>

/* pergunta: espera texto digitado ou um botão. op = {botoes:[{t,v,pri}], tipo, placeholder, max, validar(fn -> '' ou erro), mostrar(fn)} */
var _resolver = null, _op = null, _botoesEl = null;
function perguntar(op){
  op = op || {};
  return new Promise(function(res){
    _resolver = res; _op = op;
    if (op.botoes && op.botoes.length){
      var b = document.createElement('div'); b.className = 'botoes';
      op.botoes.forEach(function(x){
        var bt = document.createElement('button'); bt.type = 'button'; bt.textContent = x.t; if (x.pri) bt.className = 'pri'; else if (x.neg) bt.className = 'neg'; // 13/11: respostas negativas em vermelho claro
        bt.onclick = function(){ responder(x.v, x.t, true); }; b.appendChild(bt);
      });
      wrap.appendChild(b); _botoesEl = b; rolar();
    }
    var temTexto = op.texto !== false;
    entrada.type = op.tipo || 'text';
    entrada.inputMode = op.modo || (op.tipo === 'tel' ? 'tel' : 'text');
    if (op.modo === 'tel' && !op.tipo) entrada.type = 'tel'; // celular: teclado de telefone
    if (op.tipo === 'date'){ entrada.min = op.min || ''; } else entrada.removeAttribute('min');
    entrada.maxLength = op.max || 120;
    entrada.placeholder = temTexto ? (op.placeholder || 'Escreva aqui…') : 'Toque numa das opções acima';
    entrada.value = op.valor || '';
    entrada.disabled = !temTexto; btnEnviar.disabled = !temTexto;
    if (temTexto && !('ontouchstart' in window)) setTimeout(function(){ entrada.focus(); }, 50);
  });
}
async function responder(v, mostrar, doBotao){
  if (!_resolver) return;
  var op = _op;
  if (op.validar && !doBotao && typeof v === 'string'){
    var e = op.validar(v);
    if (e){ eu(mostrar || v); await erroMsg(e); return; }
  }
  var r = _resolver; _resolver = null; _op = null;
  if (_botoesEl){ _botoesEl.remove(); _botoesEl = null; }
  entrada.value = ''; entrada.disabled = true; btnEnviar.disabled = true;
  eu(mostrar != null ? mostrar : (op.mostrar ? op.mostrar(v) : v));
  r(v);
}
fEntrada.addEventListener('submit', function(ev){
  ev.preventDefault();
  var v = entrada.value.trim(); if (!v || !_resolver) return;
  if (_op && _op.tipo === 'date') return responder(v, dataBR(v));
  responder(v);
});
entrada.addEventListener('input', function(){
  if (_op && _op.formatar) entrada.value = _op.formatar(entrada.value);
});

/* ---------- validações (iguais às do formulário) ---------- */
function cpfValido(c){
  if (!/^\d{11}$/.test(c) || /^(\d)\1{10}$/.test(c)) return false;
  var s = 0, i, r; for (i = 0; i < 9; i++) s += +c[i] * (10 - i); r = (s * 10) % 11; if (r === 10) r = 0; if (r !== +c[9]) return false;
  s = 0; for (i = 0; i < 10; i++) s += +c[i] * (11 - i); r = (s * 10) % 11; if (r === 10) r = 0; return r === +c[10];
}
function cnpjValido(c){
  if (!/^\d{14}$/.test(c) || /^(\d)\1{13}$/.test(c)) return false;
  var calc = function(n){ var p = n === 12 ? [5,4,3,2,9,8,7,6,5,4,3,2] : [6,5,4,3,2,9,8,7,6,5,4,3,2], s = 0; for (var i = 0; i < n; i++) s += +c[i] * p[i]; var r = s % 11; return r < 2 ? 0 : 11 - r; };
  return calc(12) === +c[12] && calc(13) === +c[13];
}
function fmtTel(v){
  var d = soDig(v); if (d.length > 11 && d.indexOf('55') === 0) d = d.slice(2); d = d.slice(0, 11);
  if (d.length > 10) return d.replace(/(\d{2})(\d{5})(\d{4})/, '($1) $2-$3');
  if (d.length > 6) return d.replace(/(\d{2})(\d{4})(\d{0,4})/, '($1) $2-$3');
  if (d.length > 2) return d.replace(/(\d{2})(\d{0,5})/, '($1) $2');
  return d.length ? '(' + d : '';
}
function fmtCpf(v){
  var d = soDig(v).slice(0, 14);
  if (d.length <= 11) return d.replace(/(\d{3})(\d)/, '$1.$2').replace(/(\d{3})(\d)/, '$1.$2').replace(/(\d{3})(\d{1,2})$/, '$1-$2');
  return d.replace(/^(\d{2})(\d)/, '$1.$2').replace(/^(\d{2})\.(\d{3})(\d)/, '$1.$2.$3').replace(/\.(\d{3})(\d)/, '.$1/$2').replace(/(\d{4})(\d)/, '$1-$2');
}
var fmtCep = function(v){ var d = soDig(v).slice(0, 8); return d.length > 5 ? d.slice(0, 5) + '-' + d.slice(5) : d; };
var fmtPlaca = function(v){ return String(v || '').replace(/[^a-zA-Z0-9]/g, '').toUpperCase().slice(0, 7); };
function primeiroNome(n){ var p = String(n || '').trim().split(/\s+/)[0] || ''; return p.charAt(0).toUpperCase() + p.slice(1).toLowerCase(); }
function titulo(s){ return String(s || '').toLowerCase().replace(/(^|\s)(\S)/g, function(m, a, b){ return a + b.toUpperCase(); }).replace(/\s(De|Da|Do|Das|Dos|E)\s/g, function(m){ return m.toLowerCase(); }); }

/* ---------- datas (mesmas regras: feriados nacionais + RJ, domingo excepcional, sábado até 14h, bloqueio do dia pelo admin) ---------- */
var FERIADOS_FIXOS = ['01-01','01-20','04-21','04-23','05-01','09-07','10-12','11-02','11-15','11-20','12-25'];
function iso(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function addDias(s, n){ var p = s.split('-').map(Number), d = new Date(Date.UTC(p[0], p[1]-1, p[2])); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0,10); }
function pascoa(y){ var a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mes=Math.floor((h+l-7*m+114)/31),dia=((h+l-7*m+114)%31)+1; return y+'-'+String(mes).padStart(2,'0')+'-'+String(dia).padStart(2,'0'); }
function ehFeriado(s){ var y = +s.slice(0,4), p = pascoa(y); return FERIADOS_FIXOS.map(function(x){ return y+'-'+x; }).concat([addDias(p,-48), addDias(p,-47), addDias(p,-2), addDias(p,60)]).indexOf(s) >= 0; }
function diaSem(s){ var p = s.split('-').map(Number); return new Date(p[0], p[1]-1, p[2]).getDay(); }
var NOMES_DIA = ['domingo','segunda','terça','quarta','quinta','sexta','sábado'];
function dataBR(s){ var p = String(s).split('-'); return p.length === 3 ? p[2] + '/' + p[1] + '/' + p[0] : s; }
function rotuloDia(s, hoje){ if (s === hoje) return 'Hoje'; if (s === addDias(hoje, 1)) return 'Amanhã'; var n = NOMES_DIA[diaSem(s)]; return n.charAt(0).toUpperCase() + n.slice(1, 3) + ' ' + s.slice(8) + '/' + s.slice(5, 7); }
var HOJE = iso(new Date()), hojeBloqueado = false;
(function(){
  if (!dbF) return;
  var hojeBR = dataBR(HOJE);
  try { dbF.collection('configuracoes').doc('bloqueioAgendamento').onSnapshot(function(sn){ var d = sn && sn.exists ? sn.data() || {} : {}; hojeBloqueado = !!d.ativo && d.data === hojeBR; }, function(){}); } catch (e) {}
})();
function erroData(s){
  if (!/^\d{4}-\d{2}-\d{2}$/.test(s)) return 'Escolha a data no calendário.';
  if (s < HOJE) return 'Essa data já passou. Escolha hoje ou um dia depois.';
  if (s === HOJE && hojeBloqueado) return 'Nossa agenda para hoje está cheia. Escolha outro dia.';
  if (ehFeriado(s)) return 'Não atendemos em feriados. Escolha outro dia.';
  if (s > addDias(HOJE, 60)) return 'Escolha uma data dentro dos próximos 2 meses.';
  return '';
}
function periodoTexto(p, s){ return p === 'manha' ? 'Manhã (8h–12h)' : (diaSem(s) === 6 ? 'Tarde (13h–14h)' : 'Tarde (13h–18h)'); }

/* ---------- servidor ---------- */
function func(dados){
  return fetch(CONFIG.FUNC_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ data: dados }) })
    .then(function(r){ return r.json(); }).then(function(j){ if (j && j.error) { var e = new Error(j.error.message || 'Erro'); e.status = j.error.status; throw e; } return j && j.result; });
}
function buscarCep(cep){
  return fetch('https://viacep.com.br/ws/' + cep + '/json/').then(function(r){ return r.json(); }).then(function(j){ return j && !j.erro ? j : null; }).catch(function(){ return null; });
}
function buscarPlaca(placa){
  var ctl = typeof AbortController !== 'undefined' ? new AbortController() : null, tm = ctl ? setTimeout(function(){ ctl.abort(); }, 12000) : 0;
  return fetch(CONFIG.SCRIPT_URL + '?action=consultarPlaca&placa=' + placa, { redirect: 'follow', signal: ctl ? ctl.signal : undefined })
    .then(function(r){ return r.json(); }).then(function(res){ clearTimeout(tm); return res && res.ok && res.descricao ? res : null; }).catch(function(){ clearTimeout(tm); return null; });
}

/* ---------- pedido guardado no aparelho até o painel confirmar (igual ao formulário) ---------- */
var PEND_KEY = 'rg_ped_pendentes';
function pendLer(){ try { return JSON.parse(localStorage.getItem(PEND_KEY) || '{}') || {}; } catch(e){ return {}; } }
function pendGravar(o){ try { localStorage.setItem(PEND_KEY, JSON.stringify(o)); } catch(e){} }
function pendTirar(id){ var o = pendLer(); if (o[id]) { delete o[id]; pendGravar(o); } }
function docDoPedido(p){
  return { idPedido: p.idPedido, enviadoEm: p.enviadoEm, nomeCompleto: p.nomeCompleto, telefone: p.telefone, cep: p.cep, endereco: p.endereco,
    pontoReferencia: p.pontoReferencia, quantidadeVeiculos: p.quantidadeVeiculos, veiculos: p.veiculos, dataDesejada: p.dataDesejada || '',
    horaDesejada: p.horaDesejada || '', lido: false, criadoEm: firebase.firestore.FieldValue.serverTimestamp() };
}
function avisarPainel(p){
  try {
    if (!dbF) return Promise.resolve();
    var o = pendLer(); o[p.idPedido] = { p: p, em: Date.now() }; pendGravar(o);
    return dbF.collection('agendamentos_pendentes').doc(p.idPedido).set(docDoPedido(p)).then(function(){ pendTirar(p.idPedido); }).catch(function(e){ console.warn(e); });
  } catch (e) { return Promise.resolve(); }
}
function reenviarPendentes(){
  if (!dbF) return;
  var o = pendLer();
  Object.keys(o).forEach(function(id){
    var x = o[id] || {}, idade = Date.now() - Number(x.em || 0);
    if (!x.p || !(idade < 864e5)) { pendTirar(id); return; }
    var ref = dbF.collection('agendamentos_pendentes').doc(id);
    dbF.runTransaction(function(t){ return t.get(ref).then(function(d){ if (!d.exists) t.set(ref, docDoPedido(x.p)); }); }).then(function(){ pendTirar(id); })
      .catch(function(e){ if (e && e.code === 'permission-denied' && idade < 9e5) ref.set(docDoPedido(x.p)).then(function(){ pendTirar(id); }).catch(function(){}); });
  });
}
document.addEventListener('visibilitychange', function(){ if (document.visibilityState === 'visible') setTimeout(reenviarPendentes, 800); });
setTimeout(reenviarPendentes, 1500);

/* ---------- conversa ---------- */
var D = { nome: '', tel: '', cpf: '', cep: '', rua: '', numero: '', bairro: '', cidade: '', ref: '', veiculos: [], data: '', periodo: '' };
var IND = { codigo: '', nome: '' };

async function pNome(pre){
  if (pre){
    await bot('Seu nome completo é <b>' + esc(pre) + '</b>?');
    var r = await perguntar({ botoes: [{ t: 'Sim, é isso', v: 'sim', pri: 1 }, { t: 'Corrigir', v: 'nao' }], texto: false });
    if (r === 'sim') { D.nome = pre; return; }
  }
  await bot('Qual é o seu <b>nome completo</b>?');
  var n = await perguntar({ placeholder: 'Nome e sobrenome', max: 80, validar: function(v){ return v.trim().split(/\s+/).length < 2 || v.trim().length < 5 ? 'Escreva o nome e o sobrenome, por favor.' : ''; } });
  D.nome = titulo(n.trim());
}
async function pTel(pre){
  if (pre && soDig(pre).length >= 10){
    await bot('O seu WhatsApp é <b>' + esc(fmtTel(pre)) + '</b>?');
    var r = await perguntar({ botoes: [{ t: 'Sim', v: 'sim', pri: 1 }, { t: 'É outro número', v: 'nao' }], texto: false });
    if (r === 'sim') { D.tel = fmtTel(pre); return; }
  }
  await bot('Qual é o seu <b>WhatsApp</b> com DDD?');
  var t = await perguntar({ tipo: 'tel', placeholder: '(21) 98765-4321', max: 16, formatar: fmtTel, validar: function(v){ var d = soDig(v); if (d.length > 11 && d.indexOf('55') === 0) d = d.slice(2); return d.length < 10 || d.length > 11 ? 'Confira o número: são o DDD e mais 8 ou 9 dígitos.' : ''; } });
  D.tel = fmtTel(t);
}
async function pCpf(){
  await bot('Qual é o seu <b>CPF</b> (ou CNPJ, se for empresa)?<div class="dica">É para o seu cadastro. Se preferir, pode pular.</div>');
  var c = await perguntar({ modo: 'numeric', placeholder: '000.000.000-00', max: 18, formatar: fmtCpf, botoes: [{ t: 'Pular', v: '__pular' }],
    validar: function(v){ var d = soDig(v); return cpfValido(d) || cnpjValido(d) ? '' : 'Esse CPF/CNPJ não parece certo. Confira os números ou toque em "Pular".'; } });
  D.cpf = c === '__pular' ? '' : soDig(c);
}
async function pEndereco(){
  D.rua = D.bairro = D.cidade = D.numero = D.ref = ''; D.cep = '';
  await bot('Agora o <b>local da instalação</b>. Qual é o <b>CEP</b>?');
  var achou = null;
  while (true){
    var c = await perguntar({ modo: 'numeric', placeholder: '00000-000', max: 9, formatar: fmtCep, botoes: [{ t: 'Não sei o CEP', v: '__nao' }],
      validar: function(v){ return soDig(v).length !== 8 ? 'O CEP tem 8 números. Confira ou toque em "Não sei o CEP".' : ''; } });
    if (c === '__nao') break;
    var dig = soDig(c);
    achou = await buscarCep(dig);
    if (!achou){ await bot('Não achei esse CEP. 🤔 Confira e digite de novo, ou toque em "Não sei o CEP".'); continue; }
    D.cep = fmtCep(dig);
    var ondeTxt = [achou.logradouro, achou.bairro, (achou.localidade || '') + (achou.uf ? '/' + achou.uf : '')].filter(Boolean).join(', ');
    await bot('Achei: <b>' + esc(ondeTxt) + '</b>. É aqui?');
    var ok = await perguntar({ botoes: [{ t: 'Sim, é aqui', v: 'sim', pri: 1 }, { t: 'Não', v: 'nao' }], texto: false });
    if (ok === 'sim'){ D.rua = achou.logradouro || ''; D.bairro = achou.bairro || ''; D.cidade = achou.localidade || ''; break; }
    D.cep = ''; achou = null;
    await bot('Sem problema. Digite o CEP certo, ou toque em "Não sei o CEP".');
  }
  if (!D.rua){
    await bot('Qual é a <b>rua</b> (ou avenida)?');
    D.rua = titulo((await perguntar({ placeholder: 'Ex.: Rua das Flores', max: 100, validar: function(v){ return v.trim().length < 3 ? 'Escreva o nome da rua, por favor.' : ''; } })).trim());
  }
  if (!D.bairro){
    await bot('E o <b>bairro</b>?');
    D.bairro = titulo((await perguntar({ placeholder: 'Ex.: Centro', max: 60, validar: function(v){ return v.trim().length < 2 ? 'Escreva o bairro, por favor.' : ''; } })).trim());
  }
  if (!D.cidade){
    await bot('Qual <b>cidade</b>?');
    var cid = await perguntar({ placeholder: 'Ex.: Duque de Caxias', max: 60, botoes: [{ t: 'Duque de Caxias', v: 'Duque de Caxias' }, { t: 'Rio de Janeiro', v: 'Rio de Janeiro' }],
      validar: function(v){ return v.trim().length < 3 ? 'Escreva a cidade, por favor.' : ''; } });
    D.cidade = titulo(cid.trim());
  }
  await bot('Qual é o <b>número</b>? Se tiver complemento (casa, bloco, apto), pode escrever junto.');
  D.numero = (await perguntar({ placeholder: 'Ex.: 123, casa 2', max: 60, validar: function(v){ return !v.trim() ? 'Escreva o número, por favor (ou "s/n").' : ''; } })).trim();
  await bot('Tem algum <b>ponto de referência</b>? Ajuda o técnico a achar mais rápido.');
  var r = await perguntar({ placeholder: 'Ex.: perto do mercado, portão azul', max: 120, botoes: [{ t: 'Não precisa', v: '__pular' }] });
  D.ref = r === '__pular' ? '' : r.trim();
}
async function pVeiculo(n){
  var v = { placa: '', modelo: '', ano: '', gnv: null, rastreio: null };
  await bot((n > 1 ? 'Vamos ao <b>' + n + 'º veículo</b>. ' : 'Agora o <b>veículo</b>. ') + 'Qual é a <b>placa</b>?');
  var p = await perguntar({ placeholder: 'ABC1D23', max: 8, formatar: fmtPlaca, botoes: [{ t: 'Ainda não tem placa', v: '__sem' }],
    validar: function(x){ return /^[A-Z]{3}[0-9][A-Z0-9][0-9]{2}$/.test(fmtPlaca(x)) ? '' : 'Confira a placa (ex.: ABC1D23 ou ABC1234), ou toque em "Ainda não tem placa".'; } });
  if (p !== '__sem'){
    v.placa = fmtPlaca(p);
    await bot('Só um instante, vou consultar a placa… 🔎');
    var res = await buscarPlaca(v.placa);
    if (res){
      var desc = res.descricao + (res.dados && res.dados.cor ? ' ' + res.dados.cor : '');
      var ano = res.dados ? (res.dados.ano_modelo || res.dados.ano_fabricacao || '') : '';
      await bot('Encontrei: <b>' + esc(desc) + '</b>' + (ano ? ', ano <b>' + esc(ano) + '</b>' : '') + '. É esse?');
      var ok = await perguntar({ botoes: [{ t: 'Sim, é esse', v: 'sim', pri: 1 }, { t: 'Não é', v: 'nao' }], texto: false });
      if (ok === 'sim'){ v.modelo = desc; v.ano = String(ano || ''); }
    } else {
      await bot('Não consegui consultar a placa agora, sem problema. Vou perguntar rapidinho.');
    }
  }
  if (!v.modelo){
    await bot('Qual é o <b>modelo</b> do veículo?');
    v.modelo = (await perguntar({ placeholder: 'Ex.: Fiat Uno, Honda CG 160', max: 60, validar: function(x){ return x.trim().length < 2 ? 'Escreva o modelo, por favor.' : ''; } })).trim();
  }
  if (!v.ano){

  var oi = 'Olá' + (nome1 ? ', ' + nome1 : '') + '! 👋 Sou o assistente de agendamento da Rastreando GPS.' + (IND.nome ? ' Vi que você foi indicado por ' + IND.nome + '! 🎁' : '');
  await bot(esc(oi).replace(/Rastreando GPS/, '<b>Rastreando GPS</b>')); HIST.push({ r: 'b', t: oi });
  var q1 = 'Qual é o seu nome completo?';
  await bot(esc(q1).replace('nome completo', '<b>nome completo</b>')); HIST.push({ r: 'b', t: q1 });
  var botoes = [];
  while (true){
    // 13/11/2026 (dono): pergunta de número abre o teclado numérico (WhatsApp, CPF/CNPJ, CEP, ano)
    var ult = String((HIST[HIST.length - 1] || {}).t || '').split(/\n\s*\n/).pop().toLowerCase(), modo = 'text', ph = 'Escreva aqui…', ehCep = false;
    if (/whatsapp|telefone|celular/.test(ult) && !/está certo/.test(botoes.join(' ').toLowerCase())) { modo = 'tel'; ph = '(21) 98765-4321'; }
    else if (/cpf|cnpj/.test(ult)) { modo = 'numeric'; ph = 'Só os números'; }
    else if (/digite o seu cep|qual (é )?o (seu )?cep|o cep\b/.test(ult) && !/sabe o seu cep/.test(ult)) { modo = 'numeric'; ph = '00000-000'; ehCep = true; } // 13/11: CEP com 8 números certinhos
    else if (/\bano\b/.test(ult) && !/modelo/.test(ult)) { modo = 'numeric'; ph = 'Ex.: 2020'; }
    var resp = await perguntar({ botoes: botoes.map(function(x){ return { t: x, v: x, pri: /está certo/i.test(x), neg: /^\s*não\b/i.test(x) }; }), placeholder: ph, modo: modo, max: ehCep ? 9 : 300, formatar: ehCep ? fmtCep : null, validar: ehCep ? function(v){ return soDig(v).length !== 8 ? 'O CEP tem 8 números. Confira, por favor.' : ''; } : null }); // 13/11: "Não sei meu CEP" em destaque
    // 13/11/2026 (dono): "Outro dia" -> calendário da própria página
    if (/outro dia/i.test(resp) && botoes.indexOf(resp) >= 0){
      await bot('<b>Escolha o dia</b> no calendário aqui embaixo e toque em ➤.');
      var dia = await perguntar({ tipo: 'date', min: HOJE, placeholder: 'Escolha a data', validar: erroData });
      resp = 'Dia escolhido: ' + dia;
      HIST.push({ r: 'b', t: 'Escolha o dia no calendário.' });
    }
    // 13/11/2026 (dono): "4 ou mais" -> a PÁGINA pergunta a quantidade (não depende da IA)
    if (/ou mais$/i.test(resp) && /\d/.test(resp) && botoes.indexOf(resp) >= 0){
      await bot('Quantos são? <b>Digite o número.</b>');
      var qtd = await perguntar({ modo: 'numeric', placeholder: 'Ex.: 5', max: 2, validar: function(v){ var n = +soDig(v); return n >= 1 && n <= 30 ? '' : 'Digite só o número de veículos (ex.: 5).'; } });
      resp = 'São ' + (+soDig(qtd)) + ' veículos.';
      HIST.push({ r: 'b', t: 'Quantos são? Digite o número.' });
    }
    HIST.push({ r: 'u', t: resp });
    var r = await iaPerguntar();
    if (!r) return;
    progresso(Math.min(88, 10 + (HIST.length * 2.2)));
    botoes = r.botoes || [];
    if (r.veiculos){ // 13/11/2026 (Publicação 194): o quadro dos veículos
      var vs = await quadroVeiculos(r.veiculos);
      DADOS.veiculos = vs.map(function(v){ return { placa: v.placa, modelo: v.modelo, ano: v.ano, gnv: v.gnv, rastreio: v.rastreio }; });
      HIST.push({ r: 'u', t: '(veículos preenchidos no quadro: ' + vs.map(function(v, k){ return (k + 1) + ') ' + v.modelo + ' ' + v.ano + (v.placa ? ' placa ' + v.placa : ' sem placa') + ', GNV ' + v.gnv + ', ' + v.rastreio + ' bloqueio'; }).join('; ') + ')' });
      r = await iaPerguntar(); if (!r) return; botoes = r.botoes || [];
    }
    if (r.concluir){
      dadosParaD(DADOS);
      while (true){
        progresso(92);
        var r0 = document.createElement('div'); r0.className = 'resumo'; r0.innerHTML = resumoHtml(); wrap.appendChild(r0); rolar();
        var c = await perguntar({ botoes: [{ t: 'Está certo, agendar ✅', v: 'ok', pri: 1 }, { t: 'Corrigir algo', v: 'corrigir' }], texto: false });
        if (c === 'ok'){
          var e = erroData(D.data); // confere de novo aqui (agenda do dia cheia, por exemplo)
          if (e){ HIST.push({ r: 'u', t: '(aviso do sistema: o dia ' + D.data + ' não está mais disponível: ' + e + ' Peça outro dia.)' }); r = await iaPerguntar(); if (!r) return; botoes = r.botoes || []; break; }
          while (true){ var ok = await enviar(); if (ok !== null) return; await perguntar({ botoes: [{ t: 'Tentar de novo', v: 'de novo', pri: 1 }], texto: false }); }
        }
        HIST.push({ r: 'u', t: 'Quero corrigir uma coisa no resumo.' });
        r = await iaPerguntar(); if (!r) return; botoes = r.botoes || [];
        break;
      }
    }
  }
}

async function iniciar(){
  // já concluído neste aparelho?
  var feito = null; try { feito = JSON.parse(localStorage.getItem(LOCAL_KEY) || 'null'); } catch (e) {}
  var pre = { nome: '', telefone: '' };
  if (TOKEN){
    var info = null;
    try { info = await func({ acao: 'agl_ver', t: TOKEN }); } catch (e) { info = { erroRede: true }; }
    if (info && info.erroRede){ await bot('Não consegui abrir o seu agendamento agora. Confira a internet e recarregue a página. 🙏'); return; }
    if (!info || !info.valido){ await bot('Este link de agendamento não é válido. 😕\nPeça um novo para a gente no WhatsApp.'); travar(); return; }
    if (info.usado){ await bot('Este agendamento <b>já foi enviado</b>. ✅\nSe precisar mudar alguma coisa, fale com a gente no WhatsApp.'); telaFim(info.idPedido || '', ''); return; }
    if (info.vencido){ await bot('Este link de agendamento <b>venceu</b>. ⏰\nPeça um novo para a gente no WhatsApp.'); travar(); return; }
    pre.nome = info.nome || ''; pre.telefone = info.telefone || '';
    if (info.ind){ IND.codigo = info.ind; IND.nome = info.indNome || ''; }
    if (info.ia){ await conversaIA(pre); return; }
  } else {
    if (feito && feito.id && Date.now() - feito.em < 3 * 864e5){ await bot('Você já enviou um agendamento por aqui. ✅'); telaFim(feito.id, ''); return; }
    var m = /[?&]ind=([A-Za-z0-9]{6})(?:&|$)/.exec(location.search);
    if (m && /^[A-Z2-9]{6}$/.test(m[1].toUpperCase())){
      IND.codigo = m[1].toUpperCase();
      try { var r = await func({ acao: 'ind_nome', codigo: IND.codigo }); if (r && r.valido === false) IND.codigo = ''; else if (r && r.primeiroNome) IND.nome = r.primeiroNome; } catch (e) {}
    }
  }
  await conversa(pre);
}
iniciar();
})();
